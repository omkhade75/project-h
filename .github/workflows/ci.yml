name: CI - Build Verification & Type Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install monorepo dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma database client
        run: npm run build -w packages/database

      - name: ⚙️ Build NestJS Backend Service
        run: npm run build -w services/backend

      - name: 🛡️ Build Super Admin Portal
        run: npm run build -w apps/admin

      - name: 👑 Build Business Owner Portal
        run: npm run build -w apps/owner

      - name: 🚚 Build Supplier Portal
        run: npm run build -w apps/supplier

      - name: 🛍️ Build Customer Portal
        run: npm run build -w apps/customer

      - name: 🌐 Build Marketing Web Portal
        run: npm run build -w apps/web

      - name: ✅ All Build Checks Passed
        run: echo "All 5 portals and NestJS backend compiled cleanly with 0 errors!"
