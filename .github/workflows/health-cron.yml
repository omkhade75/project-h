name: Live Backend Health Monitor Cron

on:
  push:
    branches: [ main ]
  schedule:
    # Run every 2 hours automatically on GitHub Actions to keep Supabase & MongoDB active 24/7
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-health:
    name: Keepalive & Health Watchdog
    runs-on: ubuntu-latest

    steps:
      - name: 🩺 Ping Health & Keep Databases Warm (Supabase & MongoDB)
        run: |
          echo "Pinging https://bizora-backend-gtoe.onrender.com/api/health..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://bizora-backend-gtoe.onrender.com/api/health)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Response Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Supabase PostgreSQL & MongoDB Atlas are active and healthy!"
          else
            echo "⚠️ Health check returned HTTP $HTTP_CODE"
          fi

      - name: ⚡ Trigger Autonomous AI Fleet Scan & Auto-Heal
        run: |
          echo "Triggering https://bizora-backend-gtoe.onrender.com/api/health/auto-heal..."
          HEAL_RES=$(curl -s -X POST -w "\n%{http_code}" https://bizora-backend-gtoe.onrender.com/api/health/auto-heal)
          HEAL_CODE=$(echo "$HEAL_RES" | tail -n1)
          HEAL_BODY=$(echo "$HEAL_RES" | sed '$d')

          echo "Auto-Heal HTTP Code: $HEAL_CODE"
          echo "Auto-Heal Body: $HEAL_BODY"

          if [ "$HEAL_CODE" -eq 200 ] || [ "$HEAL_CODE" -eq 201 ]; then
            echo "✅ Autonomous healing completed successfully! All 5 portals & databases kept warm."
          fi
